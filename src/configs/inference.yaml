defaults:
  - model: baseline
  - metrics: example
  - datasets: custom_dir
  - dataloader: example
  - transforms: inference
  - _self_
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
  tokenizer_path: data/tokenizers/bpe_256.json
  tokenizer_text_dir: data/datasets/librispeech/train-clean-100
  vocab_size: 256
  lm_weight: 0.1
  lm_model:
    _target_: src.text_encoder.lm_model.HuggingFaceLM
    model_name: EleutherAI/pythia-31m
    device: ${inferencer.device}
    batch_size: 64
metrics:
  inference: []
beam_size: 10
inferencer:
  device_tensors: ["spectrogram", "text_encoded"] # which tensors should be on device (ex. GPU)
  device: auto # device name or "auto"
  save_path: "example" # any name here, can be a dataset name
  seed: 1
  from_pretrained: "saved/onebatch_smoke/model_best.pth" # path to the pretrained model
  decoding: beam_search

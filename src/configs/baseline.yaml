defaults:
  - model: conformer_ctc
  - writer: cometml
  - metrics: example
  - datasets: example
  - dataloader: example
  - transforms: baseline
  - _self_
dataloader:
  batch_size: 16
  num_workers: 4
writer:
  project_name: hse-dla-asr
optimizer:
  _target_: torch.optim.AdamW
  lr: 3e-4
lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 1e-2
  pct_start: 0.1
  steps_per_epoch: ${trainer.epoch_len}
  epochs: ${trainer.n_epochs}
  anneal_strategy: cos
loss_function:
  _target_: src.loss.CTCLossWrapper
  zero_infinity: True
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
  lm_weight: 0.1
  lm_model:
    _target_: src.text_encoder.lm_model.HuggingFaceLM
    model_name: EleutherAI/pythia-31m
    device: ${trainer.device}
    batch_size: 64
beam_size: 10
trainer:
  log_step: 50
  n_epochs: 15
  epoch_len: 1000
  max_grad_norm: 1.0
  device_tensors: ["spectrogram", "text_encoded"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: True # if True, will override the previous run with the same name
  monitor: "min val_WER_(BeamSearch)" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1
